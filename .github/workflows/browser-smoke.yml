name: Browser and Chat smoke test

on:
  push:
    branches: [main, celestial-boba-shell, 'feature/**']
  pull_request:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Celestial
        run: npm install --no-audit --no-fund
      - name: Install Chromium automation
        run: |
          npm install --no-save playwright@1.65.0 --no-audit --no-fund --ignore-scripts
          if command -v google-chrome-stable >/dev/null || command -v google-chrome >/dev/null; then
            echo "PLAYWRIGHT_CHROME_CHANNEL=chrome" >> "$GITHUB_ENV"
            echo "Using installed Google Chrome for Chromium smoke tests"
          else
            npx playwright install chromium
          fi
      - name: Verify Scramjet and Chat in a real browser
        run: node scripts/browser-smoke.mjs
      - name: Save browser screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: celestial-browser-screenshots
          path: artifacts/browser-smoke/
          retention-days: 7
          if-no-files-found: ignore
