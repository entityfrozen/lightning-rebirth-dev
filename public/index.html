<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#110b1e">
  <meta name="description" content="Lightning — themes, community, and tools.">
  <title>Lightning</title>
  <link rel="icon" href="/assets/lightning-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="sky-scene" aria-hidden="true"><div class="stars"></div><div class="cityscape"></div><div class="sakura sakura-left">✿</div><div class="sakura sakura-right">✿</div></div>
  <div id="app" class="app-shell">
    <aside id="sidebar" class="sidebar">
      <button class="brand" data-nav="home" aria-label="Go to Home"><img src="/assets/lightning-mark.svg" alt=""><span class="brand-name">Lightning<span class="brand-ver">v5.1</span></span></button>
      <div class="brand-caption">COMMUNITY & TOOLS</div>
      <div class="side-label">MENU</div>
      <nav id="mainNav" class="nav"></nav>
      <div class="side-spacer"></div>
      <div class="sidebar-feature"><strong>Theme Studio</strong><span>Create and save custom themes.</span><button data-nav="studio">Open Studio</button></div>
      <button class="profile-card" id="profileCard" data-action="profile"><span class="profile-icon" id="profileInitial">G</span><span class="profile-details"><strong id="profileName">Guest</strong><small id="profileSub">Explore Lightning</small></span><span class="profile-gear">⚙</span></button>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <button class="mobile-toggle icon-btn" data-action="menu" aria-label="Open navigation">☰</button>
        <div class="top-location"><span id="topLocation">Home</span></div>
        <div class="top-tools"><label class="global-search"><span class="search-icon">⌕</span><input id="searchInput" placeholder="Search Lightning..." autocomplete="off" aria-label="Search Lightning"><kbd>Ctrl K</kbd></label><span class="top-divider"></span><button class="icon-btn" data-action="open-drops" aria-label="Community Drops" title="Community Drops">⬡</button><button class="icon-btn" data-nav="settings" aria-label="Settings" title="Settings">⚙</button><span class="top-avatar" id="topAvatar">G</span></div>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
    <div id="mascot" class="mascot" aria-hidden="true"><div class="mascot-halo"></div><div id="mascotSprite" class="mascot-frame" role="img" aria-label="Lightning-chan"></div><div class="mascot-shade"></div></div>
    <div class="dialogue" id="dialogue" hidden><div class="dialogue-header"><span class="dialogue-name"><img src="/assets/lightning-mark.svg" alt="">Lightning-chan</span><div class="dialogue-buttons"><button data-action="auto-dialogue" id="autoDialogue">Auto</button><button data-action="skip-dialogue">Skip</button><button data-action="dialogue-log">Log</button><button data-action="close-dialogue" aria-label="Close dialogue">×</button></div></div><button class="dialogue-text" id="dialogueText" data-action="next-dialogue"><span id="dialogueLine"></span><span class="dialogue-next">⌄</span></button></div>
  </div>
  <div id="authLayer"></div>
  <div id="modalLayer"></div>
  <div id="toastLayer" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
