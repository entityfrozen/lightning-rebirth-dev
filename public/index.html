<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b16">
  <meta name="description" content="Celestial — a beautiful space to create, customize and connect.">
  <title>Celestial — Make something extraordinary</title>
  <link rel="icon" href="/assets/celestial-star.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/refresh.css">
  <link rel="stylesheet" href="/glass-ui.css">
  <link rel="stylesheet" href="/celestial.css">
</head>
<body>
  <canvas id="celestialSky" aria-hidden="true"></canvas>
  <div id="app" class="app-shell">
    <aside id="sidebar" class="sidebar">
      <button class="brand" data-nav="home" aria-label="Celestial home">
        <img src="/assets/celestial-star.svg" alt="">
        <span class="brand-name">Celestial<span class="brand-ver">STUDIO</span></span>
      </button>
      <div class="brand-caption">YOUR CREATIVE UNIVERSE</div>
      <div class="side-label">EXPLORE</div>
      <nav id="mainNav" class="nav" aria-label="Main navigation"></nav>
      <div class="side-spacer"></div>
      <button class="profile-card" id="profileCard" data-action="profile">
        <span class="profile-icon" id="profileInitial">G</span>
        <span class="profile-details"><strong id="profileName">Guest</strong><small id="profileSub">Explore Celestial</small></span>
        <span class="profile-gear" aria-hidden="true">⚙</span>
      </button>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <button class="mobile-toggle icon-btn" data-action="menu" aria-label="Open navigation">☰</button>
        <div class="top-location"><span id="topLocation">Observatory</span></div>
        <div class="top-tools">
          <label class="global-search">
            <span class="search-icon">⌕</span>
            <input id="searchInput" placeholder="Search Celestial..." autocomplete="off" aria-label="Search Celestial">
            <kbd>Ctrl K</kbd>
          </label>
          <button class="top-create" data-nav="studio" aria-label="Open Forge">✦ <span>Create</span></button>
          <span class="top-divider"></span>
          <div class="mode-pocket">
            <button id="appearanceToggle" class="glass-toggle" type="button" role="switch"
              aria-label="Light mode" aria-checked="false" title="Switch to light mode">
              <span class="glass-fallback" aria-hidden="true"><span>☾</span><span>☀</span></span>
              <canvas aria-hidden="true"></canvas>
            </button>
            <span class="mode-word" aria-hidden="true"></span>
          </div>
          <button class="icon-btn" data-action="open-drops" aria-label="Community themes" title="Community themes">✧</button>
          <button class="icon-btn" data-nav="settings" aria-label="Settings" title="Settings">⚙</button>
          <span class="top-avatar" id="topAvatar">G</span>
        </div>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>
  <div id="authLayer"></div>
  <div id="modalLayer"></div>
  <div id="toastLayer" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
